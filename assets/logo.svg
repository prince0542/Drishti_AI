<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="drishtiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="irisGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
  </defs>

  <!-- Eye Graphic -->
  <g transform="translate(15, 10)">
    <!-- Eye Contour -->
    <path d="M 10 50 Q 55 10, 100 50 Q 55 90, 10 50 Z" fill="none" stroke="url(#drishtiGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Outer Iris -->
    <circle cx="55" cy="50" r="24" fill="url(#irisGrad)" opacity="0.3" />
    
    <!-- Inner Pupil & AI Node -->
    <circle cx="55" cy="50" r="14" fill="#4F46E5" />
    <circle cx="51" cy="46" r="4" fill="#FFFFFF" />

    <!-- Acoustic Sound Waves (Accessibility Speech) -->
    <path d="M 112 36 A 20 20 0 0 1 112 64" fill="none" stroke="#7C3AED" stroke-width="4" stroke-linecap="round"/>
    <path d="M 122 26 A 35 35 0 0 1 122 74" fill="none" stroke="#06B6D4" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <text x="160" y="58" font-family="'Segoe UI', 'Roboto', 'Arial', sans-serif" font-size="44" font-weight="900" fill="#0F172A" letter-spacing="3">
    DRISHTI <tspan fill="#7C3AED">AI</tspan>
  </text>
  <text x="162" y="86" font-family="'Segoe UI', 'Roboto', 'Arial', sans-serif" font-size="15" font-weight="600" fill="#475569" letter-spacing="1.5">
    OFFLINE ACCESSIBILITY ASSISTANT
  </text>
</svg>
